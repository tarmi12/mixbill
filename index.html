<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เอกสารรวมบิล</title>
    <style>
        /* ===== ตั้งค่าหน้ากระดาษสำหรับพิมพ์ 80x80 ===== */
        @page {
            size: 80mm 80mm;
            margin: 3mm 3mm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ===== สไตล์สำหรับหน้าจอ ===== */
        body {
            font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
            background: #eef2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 32px 30px;
            max-width: 560px;
            width: 100%;
        }

        .doc-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 3px solid #eef3f9;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .doc-header .icon {
            background: #1f2a3a;
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .doc-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #141e2b;
        }
        .doc-header h1 small {
            font-weight: 400;
            font-size: 14px;
            color: #5e7086;
            display: block;
        }

        .doc-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            background: #f6f9fe;
            padding: 14px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #e6edf6;
        }
        .doc-field {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .doc-field label {
            font-size: 11px;
            font-weight: 600;
            color: #4f637b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .doc-field input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #d0dcec;
            padding: 6px 4px;
            font-size: 15px;
            font-weight: 600;
            color: #141e2b;
            outline: none;
            font-family: inherit;
            width: 100%;
        }
        .doc-field input:focus {
            border-bottom-color: #1f2a3a;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .input-row .input-group {
            flex: 2;
            min-width: 140px;
            position: relative;
        }
        .input-row .input-group .currency-symbol {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: #5e7086;
            font-size: 16px;
            pointer-events: none;
        }
        .input-row input[type="text"],
        .input-row input[type="number"] {
            width: 100%;
            padding: 14px 14px 14px 34px;
            font-size: 18px;
            font-weight: 600;
            border: 2px solid #dce4ef;
            border-radius: 16px;
            background: #fafcff;
            outline: none;
            font-family: inherit;
        }
        .input-row input[type="text"] {
            padding: 14px 14px;
        }
        .input-row input[type="number"]:focus,
        .input-row input[type="text"]:focus {
            border-color: #1f2a3a;
            box-shadow: 0 0 0 4px rgba(31, 42, 58, 0.06);
        }

        .input-row .remark-group {
            flex: 1.5;
            min-width: 100px;
        }
        .input-row .remark-group input {
            padding: 14px 14px;
            font-size: 16px;
        }

        .input-row button {
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            background: #1f2a3a;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            box-shadow: 0 6px 14px rgba(31, 42, 58, 0.15);
            transition: 0.15s;
        }
        .input-row button:hover {
            background: #111b29;
        }

        .bill-list-container {
            background: #f6f9fe;
            border-radius: 16px;
            padding: 6px 4px;
            max-height: 240px;
            overflow-y: auto;
            margin-bottom: 18px;
            border: 1px solid #e6edf6;
        }
        .bill-list-container::-webkit-scrollbar {
            width: 5px;
        }
        .bill-list-container::-webkit-scrollbar-thumb {
            background: #cbd8e8;
            border-radius: 10px;
        }

        .bill-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            margin: 4px 4px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #eef3f9;
            gap: 6px;
            flex-wrap: wrap;
        }
        .bill-item .index {
            font-weight: 700;
            color: #1f2a3a;
            font-size: 14px;
            min-width: 62px;
        }
        .bill-item .amount {
            font-weight: 700;
            font-size: 15px;
            color: #141e2b;
            min-width: 80px;
        }
        .bill-item .amount.positive {
            color: #1a7a3a;
        }
        .bill-item .amount.negative {
            color: #b33a3a;
        }
        .bill-item .remark {
            font-weight: 400;
            font-size: 13px;
            color: #5e7086;
            flex: 1;
            min-width: 60px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bill-item .remove-btn {
            background: none;
            border: none;
            color: #b0c2d8;
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            transition: 0.15s;
            flex-shrink: 0;
        }
        .bill-item .remove-btn:hover {
            color: #cf5e5e;
        }

        .empty-state {
            text-align: center;
            padding: 28px 8px;
            color: #8d9fb5;
            font-size: 15px;
        }
        .empty-state .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        .total-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #eaf0f8;
            padding: 14px 18px;
            border-radius: 16px;
            border: 2px solid #dce4ef;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .total-label {
            font-size: 16px;
            font-weight: 600;
            color: #2a3a4f;
        }
        .total-amount {
            font-size: 20px;
            font-weight: 800;
            color: #141e2b;
            text-align: right;
        }
        .total-amount .negative {
            color: #b33a3a;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .actions button {
            flex: 1;
            padding: 12px 10px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: 0.15s;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-clear-last {
            background: rgba(207, 94, 94, 0.08);
            color: #b15252;
            border: 1px solid rgba(207, 94, 94, 0.12);
        }
        .btn-clear-last:hover {
            background: rgba(207, 94, 94, 0.16);
        }

        .btn-clear-all {
            background: rgba(207, 60, 60, 0.10);
            color: #b33a3a;
            border: 2px solid rgba(207, 60, 60, 0.20);
        }
        .btn-clear-all:hover {
            background: rgba(207, 60, 60, 0.20);
            transform: scale(1.02);
        }

        .btn-reset {
            background: rgba(31, 42, 58, 0.06);
            color: #2a3a4f;
            border: 1px solid rgba(31, 42, 58, 0.08);
        }
        .btn-reset:hover {
            background: rgba(31, 42, 58, 0.12);
        }

        .print-btn-wrapper {
            margin-top: 4px;
        }
        .btn-print {
            width: 100%;
            padding: 18px 10px;
            background: #1f2a3a;
            color: #fff;
            border: none;
            border-radius: 18px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 8px 20px rgba(31, 42, 58, 0.2);
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }
        .btn-print:hover {
            background: #111b29;
        }

        /* ============================================================ */
        /* ===== โหมดพิมพ์: สีดำล้วน ฟอนต์ใหญ่ หนา คมชัด ===== */
        @media print {
            /* บังคับให้รักษาสีในการพิมพ์ */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            /* ซ่อนปุ่มและฟอร์ม */
            .no-print {
                display: none !important;
            }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }

            .container {
                max-width: 100% !important;
                width: 100% !important;
                padding: 4mm 3mm !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                background: white !important;
            }

            /* ===== ทุกอย่างเป็นสีดำล้วน บนพื้นขาว ===== */
            * {
                font-family: 'Arial', 'Helvetica', 'Sarabun', sans-serif !important;
                color: #000000 !important;
                background: transparent !important;
                border-color: #000000 !important;
            }

            .container,
            .doc-info,
            .bill-list-container,
            .bill-item,
            .total-section {
                background: white !important;
            }

            /* ===== เส้นขอบ (เฉพาะส่วนที่จำเป็น) ===== */
            .doc-header {
                border-bottom: 2px solid #000 !important;
            }
            /* ===== เอกสาร: เลขที่/วันที่/เวลา ไม่มีกรอบ และตัวเล็ก ===== */
            .doc-info {
                border: none !important;
                padding: 2px 4px !important;
                background: white !important;
                gap: 4px !important;
                margin-bottom: 8px !important;
            }
            .doc-field {
                gap: 0px !important;
            }
            .doc-field label {
                font-size: 10px !important;
                font-weight: 700 !important;
                color: #000 !important;
                letter-spacing: 0px !important;
                text-transform: none !important;
            }
            .doc-field input {
                font-size: 13px !important;
                font-weight: 700 !important;
                border-bottom: 1px solid #000 !important;
                padding: 1px 2px !important;
                background: white !important;
                color: #000 !important;
                min-height: auto !important;
            }

            .bill-item {
                border-bottom: 1px dashed #000 !important;
                border-top: none !important;
                border-left: none !important;
                border-right: none !important;
                background: white !important;
            }
            .total-section {
                border: 2px solid #000 !important;
                background: white !important;
            }

            /* ===== ฟอนต์หัวข้อหลักใหญ่ ===== */
            .doc-header h1 {
                font-size: 20px !important;
                font-weight: 900 !important;
            }
            .doc-header .icon {
                font-size: 16px !important;
                width: 28px !important;
                height: 28px !important;
                background: #000 !important;
                color: #fff !important;
            }

            /* ===== รายการบิลและยอดรวม ===== */
            .bill-item .index {
                font-size: 15px !important;
                font-weight: 900 !important;
                min-width: 60px !important;
                color: #000 !important;
            }
            .bill-item .amount {
                font-size: 17px !important;
                font-weight: 900 !important;
                color: #000 !important;
            }
            .bill-item .amount .baht-text {
                font-size: 13px !important;
                font-weight: 700 !important;
                color: #000 !important;
            }
            .bill-item .remark {
                font-size: 14px !important;
                font-weight: 700 !important;
                color: #000 !important;
            }

            .total-label {
                font-size: 12px !important;
                font-weight: 900 !important;
                color: #000 !important;
            }
            .total-amount {
                font-size: 22px !important;
                font-weight: 900 !important;
                color: #000 !important;
            }
            .total-amount .negative {
                color: #000 !important;
            }

            .empty-state {
                font-size: 15px !important;
                font-weight: 700 !important;
                color: #000 !important;
            }
            .empty-state .emoji {
                font-size: 24px !important;
            }

            /* บังคับให้อยู่ภายในหน้า */
            .container {
                page-break-after: avoid;
            }
        }

        @media (max-width: 480px) {
            .doc-info {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .container {
                padding: 20px 16px;
            }
            .input-row {
                flex-direction: column;
            }
            .input-row .remark-group {
                flex: 1;
            }
            .input-row button {
                width: 100%;
                justify-content: center;
            }
            .actions {
                flex-direction: column;
            }
            .actions button {
                width: 100%;
            }
            .bill-item {
                flex-wrap: wrap;
                gap: 4px;
            }
            .bill-item .remark {
                width: 100%;
                white-space: normal;
                font-size: 12px;
            }
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 0.4;
            height: 28px;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="doc-header">
        <div class="icon" aria-hidden="true">📄</div>
        <h1>
            เอกสารรวมบิล
            <small>เพิ่ม / หัก พร้อมหมายเหตุ</small>
        </h1>
    </div>

    <!-- ข้อมูลเอกสาร -->
    <div class="doc-info">
        <div class="doc-field">
            <label for="docNumber">📌 เลขที่</label>
            <input type="text" id="docNumber" placeholder="เลขที่เอกสาร" value="" />
        </div>
        <div class="doc-field">
            <label for="docDate">📅 วันที่</label>
            <input type="date" id="docDate" />
        </div>
        <div class="doc-field">
            <label for="docTime">⏰ เวลา</label>
            <input type="time" id="docTime" />
        </div>
    </div>

    <!-- ===== แถวเพิ่มรายการ (จำนวน + หมายเหตุ) ===== -->
    <div class="input-row no-print">
        <div class="input-group">
            <span class="currency-symbol" aria-hidden="true">฿</span>
            <input
            type="number"
            id="amountInput"
            placeholder="+100 หรือ -50"
            step="0.01"
            autofocus
            aria-label="ใส่จำนวนเงิน (บวกหรือลบ)"
            />
        </div>
        <div class="input-group remark-group">
            <input
            type="text"
            id="remarkInput"
            placeholder="หมายเหตุ (ไม่ใส่ก็ได้)"
            aria-label="หมายเหตุรายการ"
            />
        </div>
        <button id="addBtn" aria-label="เพิ่มรายการ">
            <span aria-hidden="true">➕</span> เพิ่ม
        </button>
    </div>

    <!-- รายการบิล -->
    <div class="bill-list-container" id="billList" role="list" aria-label="รายการบิล">
        <div class="empty-state" id="emptyState">
            <span class="emoji" aria-hidden="true">🧾</span>
            ยังไม่มีรายการ<br />เริ่มเพิ่มบิลเลย!
        </div>
    </div>

    <!-- สรุป -->
    <div class="total-section">
        <div class="total-label">🧮 รวมเป็นเงิน <span style="font-weight:900;"></span></div>
        <div class="total-amount" id="totalDisplay">รวม 0 รายการ = 0.00 บาท</div>
    </div>

    <!-- ===== ปุ่ม Actions ===== -->
    <div class="actions no-print">
        <button class="btn-clear-last" id="clearLastBtn" aria-label="ลบรายการสุดท้าย">
            <span aria-hidden="true">✕</span> ลบรายการล่าสุด
        </button>
        <button class="btn-clear-all" id="clearAllBtn" aria-label="เคลียร์รายการทั้งหมด">
            <span aria-hidden="true">🧹</span> เคลียร์รายการทั้งหมด
        </button>
        <button class="btn-reset" id="resetBtn" aria-label="ล้างข้อมูลเอกสาร">
            <span aria-hidden="true">⟳</span> ล้างข้อมูล
        </button>
    </div>

    <!-- ปุ่ม พิมพ์ -->
    <div class="print-btn-wrapper no-print">
        <button class="btn-print" id="printBtn">
            <span>🖨️</span> รวมเงินและพิมพ์
        </button>
    </div>

</div>

<script>
    (function() {
        'use strict';

        const amountInput = document.getElementById('amountInput');
        const remarkInput = document.getElementById('remarkInput');
        const addBtn = document.getElementById('addBtn');
        const billList = document.getElementById('billList');
        const emptyState = document.getElementById('emptyState');
        const totalDisplay = document.getElementById('totalDisplay');
        const printBtn = document.getElementById('printBtn');
        const clearLastBtn = document.getElementById('clearLastBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const resetBtn = document.getElementById('resetBtn');

        let bills = [];

        function formatBaht(value) {
            return value.toFixed(2);
        }

        function render() {
            while (billList.firstChild) {
                billList.removeChild(billList.firstChild);
            }

            if (bills.length === 0) {
                billList.appendChild(emptyState);
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                bills.forEach((item, index) => {
                    const amount = item.amount;
                    const remark = item.remark || '';

                    const div = document.createElement('div');
                    div.className = 'bill-item';
                    div.setAttribute('role', 'listitem');

                    const indexSpan = document.createElement('span');
                    indexSpan.className = 'index';
                    indexSpan.textContent = `บิลที่ ${index + 1}`;
                    div.appendChild(indexSpan);

                    const amountSpan = document.createElement('span');
                    amountSpan.className = 'amount';
                    if (amount >= 0) {
                        amountSpan.classList.add('positive');
                        amountSpan.innerHTML = `+ ${formatBaht(amount)} <span class="baht-text">บาท</span>`;
                    } else {
                        amountSpan.classList.add('negative');
                        amountSpan.innerHTML = `- ${formatBaht(Math.abs(amount))} <span class="baht-text">บาท</span>`;
                    }
                    div.appendChild(amountSpan);

                    if (remark) {
                        const remarkSpan = document.createElement('span');
                        remarkSpan.className = 'remark';
                        remarkSpan.textContent = remark;
                        div.appendChild(remarkSpan);
                    } else {
                        const remarkSpan = document.createElement('span');
                        remarkSpan.className = 'remark';
                        remarkSpan.textContent = '';
                        div.appendChild(remarkSpan);
                    }

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-btn no-print';
                    removeBtn.setAttribute('aria-label', `ลบ ${indexSpan.textContent}`);
                    removeBtn.innerHTML = '✕';
                    removeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        removeItem(index);
                    });
                    div.appendChild(removeBtn);

                    billList.appendChild(div);
                });
            }

            const total = bills.reduce((sum, item) => sum + item.amount, 0);
            const count = bills.length;
            let totalText = `รวม ${count} รายการ = `;
            if (total >= 0) {
                totalText += `${formatBaht(total)} บาท`;
            } else {
                totalText += `- ${formatBaht(Math.abs(total))} บาท`;
            }
            totalDisplay.innerHTML = totalText;

            amountInput.focus();
        }

        function addItem() {
            let raw = amountInput.value.trim();
            if (raw === '') {
                alert('กรุณาใส่จำนวนเงิน (เช่น 100 หรือ -50)');
                amountInput.focus();
                return;
            }

            let normalized = raw.replace(/,/g, '.');
            let number = parseFloat(normalized);

            if (isNaN(number)) {
                alert('กรุณาใส่จำนวนเงินที่ถูกต้อง (เช่น 100 หรือ -50)');
                amountInput.value = '';
                amountInput.focus();
                return;
            }

            number = Math.round(number * 100) / 100;
            const remark = remarkInput.value.trim();

            bills.push({ amount: number, remark: remark });
            render();

            amountInput.value = '';
            remarkInput.value = '';
            amountInput.focus();
        }

        function removeItem(index) {
            if (index >= 0 && index < bills.length) {
                bills.splice(index, 1);
                render();
            }
        }

        function clearAllBills() {
            if (bills.length === 0) {
                alert('ไม่มีรายการบิลที่จะเคลียร์');
                return;
            }
            if (confirm('คุณต้องการเคลียร์รายการบิลทั้งหมดใช่หรือไม่?')) {
                bills = [];
                render();
            }
        }

        function resetDocumentInfo() {
            if (!confirm('คุณต้องการล้างข้อมูลเอกสาร (เลขที่, วันที่, เวลา) ใช่หรือไม่?')) {
                return;
            }
            document.getElementById('docNumber').value = '';
            document.getElementById('docDate').value = '';
            document.getElementById('docTime').value = '';
        }

        function setDefaultDateTime() {
            const now = new Date();
            const dateInput = document.getElementById('docDate');
            const timeInput = document.getElementById('docTime');

            if (dateInput) {
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                dateInput.value = `${year}-${month}-${day}`;
            }

            if (timeInput) {
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                timeInput.value = `${hours}:${minutes}`;
            }
        }
        setDefaultDateTime();

        // ---- Event Listeners ----
        addBtn.addEventListener('click', addItem);

        amountInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addItem();
            }
        });

        remarkInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addItem();
            }
        });

        clearLastBtn.addEventListener('click', function() {
            if (bills.length === 0) {
                alert('ไม่มีรายการที่จะลบ');
                return;
            }
            bills.pop();
            render();
        });

        clearAllBtn.addEventListener('click', clearAllBills);
        resetBtn.addEventListener('click', resetDocumentInfo);

        printBtn.addEventListener('click', function() {
            if (bills.length === 0) {
                if (!confirm('ยังไม่มีรายการบิล ต้องการพิมพ์เอกสารเปล่าหรือไม่?')) {
                    return;
                }
            }
            window.print();
        });

        amountInput.addEventListener('focus', function() {
            this.select();
        });

        render();
    })();
</script>

</body>
</html>
